
[web-marketplace-passf]

; rule against call to /forgot-password.php (see file etc/fail2ban/filter.d/web-marketplace-passf)
enabled = true
port    = http,https
filter  = web-marketplace-passf
logpath = /home/dolibarr/asso.dolibarr.org/dolibarr_documents/dolibarr_website_marketplace.log
action  = %(action_mw)s
bantime  = 4320000   ; 50 days
findtime = 86400     ; 1 day
maxretry = 20		 ; 20 access to page forgot-password on same day, we ban
